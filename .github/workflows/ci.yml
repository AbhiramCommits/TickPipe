name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build and install (C++ extension + deps)
        run: pip install -e ".[dev]"

      - name: Build wheel
        run: pip wheel . --no-deps --wheel-dir dist

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy --strict src

      - name: Pytest with coverage
        run: pytest --cov=tickpipe --cov-report=term-missing tests
