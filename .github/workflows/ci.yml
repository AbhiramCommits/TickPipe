name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tickpipe
          POSTGRES_PASSWORD: tickpipe
          POSTGRES_DB: experiments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickpipe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build and install (C++ extension + deps)
        run: pip install -e ".[dev]"

      - name: Build wheel
        run: pip wheel . --no-deps --wheel-dir dist

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy --strict src

      - name: Pytest with coverage
        run: pytest --cov=tickpipe --cov-report=term-missing tests
        env:
          TICKPIPE_TEST_DATABASE_URL: postgresql+psycopg://tickpipe:tickpipe@localhost:5432/experiments
