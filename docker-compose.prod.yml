services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tickpipe
      POSTGRES_PASSWORD: tickpipe
      POSTGRES_DB: experiments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickpipe -d experiments"]
      interval: 5s
      timeout: 5s
      retries: 10

  tickpipe:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TICKPIPE_EXPERIMENT_REGISTRY_URL: postgresql+psycopg://tickpipe:tickpipe@postgres:5432/experiments
    command:
      [
        "ingest",
        "--symbol",
        "BTC-USD",
        "--data-dir",
        "/app/data",
        "--metrics-port",
        "9090",
        "--policy",
        "block",
      ]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
