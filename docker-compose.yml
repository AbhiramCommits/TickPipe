services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tickpipe
      POSTGRES_PASSWORD: tickpipe
      POSTGRES_DB: experiments
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickpipe -d experiments"]
      interval: 5s
      timeout: 5s
      retries: 10

  tickpipe:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TICKPIPE_EXPERIMENT_REGISTRY_URL: postgresql://tickpipe:tickpipe@postgres:5432/experiments
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
